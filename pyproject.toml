[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shetty-assistant"
version = "0.1.0"
description = "A local-first, permission-based personal assistant for macOS."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.27,<0.29",
  "uvicorn>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
shetty = "shetty.__main__:main"

[tool.setuptools.packages.find]
include = ["shetty*"]

[tool.setuptools.package-data]
shetty = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
